[General]
network = qci_qbv.QciQbvThreeSchemes
sim-time-limit = 800ms
result-dir = results_backlog
repeat = 1

# Common Ethernet and host configuration
**.eth[*].bitrate = 1Gbps
**.mac.duplexMode = true
**.checksumMode = "declared"
**.fcsMode = "declared"

*.nstClient.numApps = 1
*.nstClient.app[0].typename = "UdpSourceApp"
*.nstClient.app[0].source.packetLength = 1000B
*.nstClient.app[0].source.productionInterval = 1ms
*.nstClient.app[0].io.destAddress = "server"
*.nstClient.app[0].io.destPort = 1000
*.nstClient.app[0].io.localPort = 1000

*.stClient.numApps = 1
*.stClient.app[0].typename = "qci_qbv.TimingAdmissionUdpSourceApp"
*.stClient.app[0].interfaceTableModule = "^.interfaceTable"
*.stClient.app[0].destAddresses = "server"
*.stClient.app[0].destPort = 1001
*.stClient.app[0].localPort = 1001
*.stClient.app[0].messageLength = 1000B
*.stClient.app[0].sendInterval = 1ms
*.stClient.app[0].startTime = 0s
*.stClient.app[0].scenario = "normal"
*.stClient.app[0].admissionMode = "none"
*.stClient.app[0].numFrames = 200
*.stClient.app[0].extraInsertCount = 15
*.stClient.app[0].cycle = 1ms
*.stClient.app[0].windowStart = 900us
*.stClient.app[0].earlyOffset = 80us
*.stClient.app[0].lateOffset = 150us
*.stClient.app[0].burstOffset = 120us
*.stClient.app[0].earlyTolerance = 50us
*.stClient.app[0].lateTolerance = 50us
*.stClient.app[0].deadline = 1ms
*.stClient.app[0].serviceTime = 10us

*.server.numApps = 2
*.server.app[0].typename = "UdpSinkApp"
*.server.app[0].io.localPort = 1000
*.server.app[1].typename = "qci_qbv.TimingUdpSinkApp"
*.server.app[1].interfaceTableModule = "^.interfaceTable"
*.server.app[1].destAddresses = ""
*.server.app[1].destPort = 0
*.server.app[1].localAddress = ""
*.server.app[1].localPort = 1001
*.server.app[1].messageLength = 0B
*.server.app[1].sendInterval = 1s
*.server.app[1].startTime = 0s
*.server.app[1].stopTime = 300ms
*.server.app[1].cycle = 1ms
*.server.app[1].windowStart = 900us

# Stream identification and Qbv priority mapping
*.nstClient.hasOutgoingStreams = true
*.stClient.hasOutgoingStreams = true
*.nstClient.bridging.streamIdentifier.identifier.mapping = [{stream: "nst", packetFilter: expr(udp.destPort == 1000)}]
*.stClient.bridging.streamIdentifier.identifier.mapping = [{stream: "st", packetFilter: expr(udp.destPort == 1001)}]
*.nstClient.bridging.streamCoder.encoder.mapping = [{stream: "nst", pcp: 0}]
*.stClient.bridging.streamCoder.encoder.mapping = [{stream: "st", pcp: 4}]
*.switch.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]

# Qbv egress shaping. Traffic class 1 is the ST class.
*.switch.hasEgressTrafficShaping = true
*.switch.eth[*].macLayer.queue.numTrafficClasses = 2
*.switch.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = true
*.switch.eth[*].macLayer.queue.transmissionGate[0].durations = [900us, 100us]
*.switch.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.switch.eth[*].macLayer.queue.transmissionGate[1].durations = [900us, 100us]

[Config BacklogQbvOnly]
description = "Qbv-only baseline"
*.stClient.app[0].scenario = "backlog"
*.stClient.app[0].admissionMode = "none"
*.switch.hasIngressTrafficFiltering = false

[Config BacklogFullQciQbv]
description = "Full Qci ingress filter, gate and meter plus Qbv"
*.stClient.app[0].scenario = "backlog"
*.stClient.app[0].admissionMode = "none"
*.switch.hasIngressTrafficFiltering = true
*.switch.hasIncomingStreams = true
*.stClient.bridging.streamCoder.encoder.mapping = [{stream: "st", vlan: 4, pcp: 4}]
*.switch.bridging.streamCoder.decoder.mapping = [{vlan: 4, stream: "st"}]
*.switch.bridging.streamFilter.ingress.numStreams = 1
*.switch.bridging.streamFilter.ingress.hasDefaultPath = true
*.switch.bridging.streamFilter.ingress.classifier.mapping = {"st": 0}
*.switch.bridging.streamFilter.ingress.gate[0].typename = "PeriodicGate"
*.switch.bridging.streamFilter.ingress.gate[0].initiallyOpen = false
*.switch.bridging.streamFilter.ingress.gate[0].durations = [900us, 100us]
*.switch.bridging.streamFilter.ingress.meter[0].typename = "SingleRateTwoColorMeter"
*.switch.bridging.streamFilter.ingress.meter[0].committedInformationRate = 10Mbps
*.switch.bridging.streamFilter.ingress.meter[0].committedBurstSize = 1200B

[Config BacklogClippedQciQbv]
description = "Clipped Qci timing admission plus Qbv"
*.stClient.app[0].scenario = "backlog"
*.stClient.app[0].admissionMode = "clipped"
*.switch.hasIngressTrafficFiltering = false







